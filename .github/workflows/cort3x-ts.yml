name: cort3x-ts

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cort3x-ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # node:sqlite needs >= 22.5
          node-version: '22'
          cache: npm
          cache-dependency-path: cort3x-ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Accountability suites (integration, retention, encryption, unarchive, path-traversal, chain-integrity, race, stress)
        run: npm run test:accountability

  postgres:
    name: Postgres integration (schema, persistence, claims)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cort3x-ts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Each test file creates and drops its own scg_test_* database.
      TEST_DATABASE_URL: postgres://postgres:ci_test_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cort3x-ts/package-lock.json
      - run: npm ci
      # 006 is exercised through psql exactly as its header documents.
      - run: psql --version
      - name: Postgres integration tests
        run: npm run test:pg
